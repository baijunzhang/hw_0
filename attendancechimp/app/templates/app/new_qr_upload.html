<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload QR Code</title>
</head>
<body>
    <h1>Upload a QR Code</h1>

    <form method="post"
          action="{% url 'createQRCodeUpload' %}"
          enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="imageUpload" accept="image/*" required>
        <button type="submit">Upload</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <h1>Sign Up</h1>

    <form action="/app/createUser" method="post">
        {% csrf_token %}

        <p>Username: <input type="text" name="user_name" required></p>
        <p>Email: <input type="email" name="email" required></p>
        <p>Password: <input type="password" name="password" required></p>

        <p>
            <input type="radio" name="is_student" value="1" checked> Student
            <input type="radio" name="is_student" value="0"> Instructor
        </p>

        <button type="submit">Sign Up</button>
    </form>
</body>
</html>

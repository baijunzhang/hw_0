<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
</head>
<body>
    <h1>Create a Course</h1>

    <form method="post" action="{% url 'createCourse' %}">
        {% csrf_token %}

        <p>
            <label>Course name:
                <input type="text" name="course-name" maxlength="200" required>
            </label>
        </p>

        <p>
            <label>Start time:
                <input type="time" name="start-time" required>
            </label>
        </p>

        <p>
            <label>End time:
                <input type="time" name="end-time" required>
            </label>
        </p>

        <p>Select at least one day:</p>
        <label><input type="checkbox" name="day-mon"> Monday</label>
        <label><input type="checkbox" name="day-tue"> Tuesday</label>
        <label><input type="checkbox" name="day-wed"> Wednesday</label>
        <label><input type="checkbox" name="day-thu"> Thursday</label>
        <label><input type="checkbox" name="day-fri"> Friday</label>

        <p><button type="submit">Create Course</button></p>
    </form>
</body>
</html>

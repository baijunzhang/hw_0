<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { text-align: center; font-family: Arial; margin: 40px; }
    </style>
</head>
<body>
    <h1>AttendanceChimp</h1>
    <p>An app for tracking attendance in classes.</p>

    <p>Current time: {{ current_time }}</p>

    {% if logged_in_user %}
        <p>Logged in as: <b>{{ logged_in_user.username }}</b></p>
    {% else %}
        <p>Not logged in.</p>
    {% endif %}
</body>
</html>
